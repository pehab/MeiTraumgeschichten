name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, coverage, lint and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify update routing and download validation
        run: bash scripts/test-update-contract.sh
      - name: Check original sound assets and packaging
        run: |
          python3 scripts/generate_sounds.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test core and enforce 85 percent line coverage
        run: ./gradlew :core:check --stacktrace
      - name: Lint both distribution variants and build test APK
        run: ./gradlew :app:lintGithubDebug :app:lintPlayRelease :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --stacktrace
      - name: Upload APK for device tests
        uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/androidTest/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
          retention-days: 14

  device-test:
    name: Android 35 device smoke tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: device-test-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: device-results/
          retention-days: 14

  signed-release:
    name: Publish stable GitHub update when signing is configured
    needs: [build, device-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent private signing identity
        id: signing
        env:
          MEI_SIGNING_JSON: ${{ secrets.MEI_SIGNING_JSON }}
        run: python3 .github/scripts/setup-github-signing.py
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
      - name: Build persistently signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: ./gradlew :app:assembleGithubRelease --stacktrace
      - name: Verify signing certificate
        if: steps.signing.outputs.ready == 'true'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk'
      - name: Publish immutable APK and update manifest
        if: steps.signing.outputs.ready == 'true'
        run: python3 .github/scripts/publish-github-update.py
      - name: Explain missing signing configuration
        if: steps.signing.outputs.ready != 'true'
        run: echo '::notice::Set MEI_SIGNING_JSON to enable stable installable releases. CI debug builds are for validation only and are not published as updates.'
