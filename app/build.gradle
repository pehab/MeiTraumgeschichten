plugins { id 'com.android.application' }

android {
    namespace 'de.haberland.meitraumgeschichten'
    compileSdk 35
    defaultConfig {
        applicationId 'de.haberland.meitraumgeschichten'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    flavorDimensions += 'distribution'
    productFlavors {
        github { dimension 'distribution' }
        play { dimension 'distribution' }
    }
    signingConfigs {
        if (System.getenv('MEI_GITHUB_STORE_FILE')) {
            stable {
                storeFile file(System.getenv('MEI_GITHUB_STORE_FILE'))
                storePassword System.getenv('MEI_GITHUB_STORE_PASSWORD')
                keyAlias System.getenv('MEI_GITHUB_KEY_ALIAS')
                keyPassword System.getenv('MEI_GITHUB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MEI_GITHUB_STORE_FILE')) signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
    androidResources { noCompress 'mdl', 'fst', 'int', 'bin', 'wav' }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':core')
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.google.android.play:app-update:2.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Every APK contains its offline model. A missing model must fail the build.
tasks.register('prepareOfflineModel', Exec) {
    commandLine 'python3', rootProject.file('scripts/prepare_model.py')
    inputs.file rootProject.file('scripts/prepare_model.py')
    outputs.dir file('src/main/assets/model-de')
}
tasks.named('preBuild').configure { dependsOn 'prepareOfflineModel' }
tasks.register('prepareSoundAssets', Exec) {
    commandLine 'python3', rootProject.file('scripts/generate_sounds.py')
    inputs.file rootProject.file('scripts/generate_sounds.py')
    outputs.dir file('src/main/assets/sounds')
}
tasks.named('preBuild').configure { dependsOn 'prepareSoundAssets' }
