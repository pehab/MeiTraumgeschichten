plugins { id 'java-library'; id 'jacoco' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies { testImplementation 'junit:junit:4.13.2' }
jacoco { toolVersion = '0.8.12' }
test { finalizedBy jacocoTestReport; systemProperty 'stories', rootProject.file('app/src/main/assets/stories').absolutePath }
jacocoTestReport { dependsOn test; reports { xml.required = true; html.required = true } }
jacocoTestCoverageVerification {
    dependsOn test
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.85 } } }
}
check.dependsOn jacocoTestCoverageVerification
